# Manual, staging-only D1 migration; no production Environment, config or database path.
name: Staging Strict OTP Migration

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full current main SHA with successful exact-main CI and reviewed 0040
        required: true
        type: string
      confirm_staging_migration:
        description: Confirm the staging D1 identity and authorize applying/certifying 0040
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: frigo-deploy-staging
  cancel-in-progress: false

jobs:
  certify:
    if: github.ref == 'refs/heads/main' && inputs.confirm_staging_migration == true
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Check exact current main, pinned migrations, hosted CI and staging config
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_REF: ${{ inputs.ref }}
        run: node scripts/staging-otp-migration-check.mjs gate staging-migration-receipt.json

      - name: Require staging Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Staging Cloudflare D1 credentials unavailable in staging Environment"
            exit 1
          fi

      - name: Prove Cloudflare account and exact staging D1 identity (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm wrangler whoami > /dev/null
          pnpm wrangler d1 list --json > staging-d1-list.json
          pnpm wrangler d1 info frigo-db-staging-v3 --json --config wrangler.staging.jsonc > staging-d1-info.json
          node scripts/staging-otp-migration-check.mjs identity staging-migration-receipt.json staging-d1-list.json staging-d1-info.json

      - name: Read and classify exact staging migration ledger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm wrangler d1 execute frigo-db-staging-v3 --remote --yes --config wrangler.staging.jsonc --command "SELECT name FROM d1_migrations ORDER BY name" --json > staging-pre-ledger.json
          node scripts/staging-otp-migration-check.mjs pre-ledger staging-migration-receipt.json staging-pre-ledger.json

      - name: Capture Time Travel bookmark and pre-migration health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm wrangler d1 time-travel info frigo-db-staging-v3 --json --config wrangler.staging.jsonc > staging-bookmark.json
          node scripts/staging-otp-migration-check.mjs bookmark staging-migration-receipt.json staging-bookmark.json
          d1() { pnpm wrangler d1 execute frigo-db-staging-v3 --remote --yes --config wrangler.staging.jsonc --command "$1" --json; }
          d1 "PRAGMA foreign_key_check" > staging-pre-fk.json
          d1 "PRAGMA quick_check" > staging-pre-quick.json
          d1 "$(node scripts/staging-otp-migration-check.mjs query baseline)" > staging-pre-counts.json
          node scripts/staging-otp-migration-check.mjs pre-health staging-migration-receipt.json staging-pre-fk.json staging-pre-quick.json staging-pre-counts.json

      - name: Verify exact Wrangler migration plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm wrangler d1 migrations list frigo-db-staging-v3 --remote --config wrangler.staging.jsonc > staging-plan.txt
          node scripts/staging-otp-migration-check.mjs plan staging-migration-receipt.json staging-plan.txt

      - name: Recheck current main, CI and ledger immediately before applying
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git fetch origin main
          node scripts/staging-otp-migration-check.mjs recheck staging-migration-receipt.json
          pnpm wrangler d1 execute frigo-db-staging-v3 --remote --yes --config wrangler.staging.jsonc --command "SELECT name FROM d1_migrations ORDER BY name" --json > staging-pre-ledger.json
          node scripts/staging-otp-migration-check.mjs pre-ledger staging-migration-receipt.json staging-pre-ledger.json
          pnpm wrangler d1 migrations list frigo-db-staging-v3 --remote --config wrangler.staging.jsonc > staging-plan.txt
          node scripts/staging-otp-migration-check.mjs plan staging-migration-receipt.json staging-plan.txt

      - name: Apply only the certified 0040 chain via Wrangler's staging ledger
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mode="$(node -p 'require("./staging-migration-receipt.json").preLedger.mode')"
          if [ "$mode" = apply ]; then
            pnpm wrangler d1 migrations apply frigo-db-staging-v3 --remote --config wrangler.staging.jsonc
          elif [ "$mode" = certify ]; then
            echo "Migration 0040 already present; certification only."
          else
            exit 1
          fi

      - name: Certify ledger, health, strict OTP schema, unchanged data and repository schema gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          d1() { pnpm wrangler d1 execute frigo-db-staging-v3 --remote --yes --config wrangler.staging.jsonc --command "$1" --json; }
          d1 "SELECT name FROM d1_migrations ORDER BY name" > staging-post-ledger.json
          d1 "PRAGMA foreign_key_check" > staging-post-fk.json
          d1 "PRAGMA quick_check" > staging-post-quick.json
          d1 "$(node scripts/staging-otp-migration-check.mjs query baseline)" > staging-post-counts.json
          d1 "$(node scripts/staging-otp-migration-check.mjs query schema)" > staging-t20-schema.json
          d1 "$(node scripts/d1-schema-gate.mjs render)" > staging-schema-gate.json
          node scripts/staging-otp-migration-check.mjs post staging-migration-receipt.json staging-post-ledger.json staging-post-fk.json staging-post-quick.json staging-post-counts.json staging-t20-schema.json staging-schema-gate.json

      - name: Save sanitized staging receipt only (including pre-migration bookmark)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-d1-0040-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-migration-receipt.json
          if-no-files-found: ignore
          retention-days: 90
