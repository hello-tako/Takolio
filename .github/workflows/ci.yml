name: CI

on:
  push:
    branches: [main, master, codex/security-hardening-sync]
  pull_request:
    branches: [main, master]

# Least privilege: validation only reads the repository. It never needs write
# scopes, and fork pull requests receive no secrets at all.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Vitest Unit Tests
        run: pnpm test

      # Repository-specific safe check: replays every migration into an
      # in-memory SQLite database with integrity/foreign-key assertions.
      - name: Migration smoke (local SQLite)
        run: pnpm check:migrations

      - name: Build Web & Worker
        run: pnpm build
