# Execution stays disabled until reviewed target policy and protected environment
# configuration are supplied. Creating this workflow authorizes no live action.
name: Admin Production Release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed main SHA
        type: string
        required: true
      operation:
        description: Fixed operation; Admin remains disabled
        type: choice
        options: [deploy-disabled, disable, rollback-disabled]
        required: true
      execute:
        description: Requires separate owner authorization and two signatures
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: admin-release-production
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:admin
      - name: Offline disabled Worker bundle validation
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm exec wrangler deploy --dry-run -c wrangler.admin.jsonc --outdir .artifacts/admin-release/admin-bundle
          pnpm exec wrangler deploy --dry-run -c wrangler.admin-facade.jsonc --outdir .artifacts/admin-release/facade-bundle
      - name: Prepare offline plan without credentials
        env:
          RELEASE_ENVIRONMENT: production
          RELEASE_OPERATION: ${{ inputs.operation }}
        run: node scripts/admin-release-adapter.mjs plan "$RELEASE_ENVIRONMENT" "$RELEASE_OPERATION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-offline-plan-${{ github.run_id }}
          path: .artifacts/admin-release/plan.json
          if-no-files-found: error
          retention-days: 90
  execute:
    needs: plan
    if: inputs.execute == true && vars.ADMIN_RELEASE_EXECUTION_ENABLED == 'true' && github.ref == 'refs/heads/main' && inputs.source_sha == github.sha && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: admin-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:admin
      - name: Verify source policy and signed authorization
        env:
          RELEASE_ENVIRONMENT: production
          RELEASE_OPERATION: ${{ inputs.operation }}
          ADMIN_RELEASE_EXECUTION_ENABLED: ${{ vars.ADMIN_RELEASE_EXECUTION_ENABLED }}
          ADMIN_RELEASE_AUTHORIZATION: ${{ secrets.ADMIN_RELEASE_AUTHORIZATION }}
          GH_TOKEN: ${{ secrets.ADMIN_RELEASE_GITHUB_READ_TOKEN }}
        run: node scripts/admin-release-adapter.mjs authorize "$RELEASE_ENVIRONMENT" "$RELEASE_OPERATION"
      - name: Persist pre-action audit before any Cloudflare credential is available
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-pre-action-${{ github.run_id }}
          path: .artifacts/admin-release/pre-action.json
          if-no-files-found: error
          retention-days: 90
      - name: Execute fixed authorized operation and verify result
        env:
          RELEASE_ENVIRONMENT: production
          RELEASE_OPERATION: ${{ inputs.operation }}
          ADMIN_RELEASE_EXECUTION_ENABLED: ${{ vars.ADMIN_RELEASE_EXECUTION_ENABLED }}
          ADMIN_RELEASE_AUTHORIZATION: ${{ secrets.ADMIN_RELEASE_AUTHORIZATION }}
          GH_TOKEN: ${{ secrets.ADMIN_RELEASE_GITHUB_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADMIN_RELEASE_CLOUDFLARE_TOKEN }}
        run: node scripts/admin-release-adapter.mjs execute "$RELEASE_ENVIRONMENT" "$RELEASE_OPERATION"
      - name: Retain receipt, including uncertain partial-failure state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-operation-${{ github.run_id }}
          path: .artifacts/admin-release/receipt.json
          if-no-files-found: warn
          retention-days: 90
