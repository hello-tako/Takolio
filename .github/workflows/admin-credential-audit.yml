name: Admin Foreign Issuer Evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  foreign-issuer:
    if: github.repository_id == '1422954151' && github.ref == 'refs/heads/codex/admin-issuer-probe-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Obtain and encrypt genuine foreign-issuer assertion
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          import {createPublicKey,verify,randomBytes,createCipheriv,publicEncrypt,createHash,constants} from 'node:crypto';
          const aud='fed43dc973208d1b12fdcc0c6df838743ea450b59ace3842b665126a8673a9ce';
          const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience',aud);
          const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          if(!response.ok)throw Error('OIDC provider request failed');
          const {value:token}=await response.json();
          if(typeof token!=='string')throw Error('OIDC assertion missing');
          console.log('::add-mask::'+token);
          const [h,p,s]=token.split('.'),header=JSON.parse(Buffer.from(h,'base64url')),claims=JSON.parse(Buffer.from(p,'base64url'));
          if(header.alg!=='RS256'||claims.iss!=='https://token.actions.githubusercontent.com'||claims.aud!==aud||claims.repository_id!=='1422954151'||claims.ref!=='refs/heads/codex/admin-issuer-probe-20261022'||claims.exp*1000<=Date.now())throw Error('Foreign assertion precondition failed');
          const jwksResponse=await fetch('https://token.actions.githubusercontent.com/.well-known/jwks');
          if(!jwksResponse.ok)throw Error('Foreign JWKS unavailable');
          const jwks=await jwksResponse.json(),key=jwks.keys.find(k=>k.kid===header.kid);
          if(!key||!verify('RSA-SHA256',Buffer.from(h+'.'+p),createPublicKey({key,format:'jwk'}),Buffer.from(s,'base64url')))throw Error('Foreign assertion signature invalid');
          const encryptionKey=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',encryptionKey,iv);
          const ciphertext=Buffer.concat([cipher.update(token,'utf8'),cipher.final()]);
          const encryptedKey=publicEncrypt({key:readFileSync('.github/acceptance/issuer-probe-public.pem'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},encryptionKey);
          mkdirSync('.artifacts/issuer-evidence',{recursive:true});
          writeFileSync('.artifacts/issuer-evidence/assertion.encrypted.json',JSON.stringify({algorithm:'RSA-OAEP-SHA256+A256GCM',key:encryptedKey.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),ciphertext:ciphertext.toString('base64')}));
          writeFileSync('.artifacts/issuer-evidence/provider-verification.json',JSON.stringify({issuer:claims.iss,signatureVerified:true,audienceMatches:true,expiresAt:new Date(claims.exp*1000).toISOString(),tokenSha256:createHash('sha256').update(token).digest('hex'),runId:process.env.GITHUB_RUN_ID,targetSource:'0322a9197bee4a4a42d95cc150f8d4fff6d53ba8',scope:'Genuine foreign issuer input; not a deployed-verifier result'},null,2));
          console.log('Genuine foreign-issuer input verified and encrypted for local staging acceptance.');
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-foreign-issuer-${{ github.run_id }}
          path: .artifacts/issuer-evidence
          if-no-files-found: error
          retention-days: 1
