name: Admin Credential Audit
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Dedicated protected Admin credential to verify (GET-only)
        type: choice
        options: [admin-staging, admin-production]
        default: admin-staging
        required: true
permissions:
  contents: read
concurrency:
  group: admin-credential-audit-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main' && (inputs.environment == 'admin-staging' || inputs.environment == 'admin-production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Read only sanitized Admin account metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADMIN_RELEASE_CLOUDFLARE_TOKEN }}
        run: node scripts/admin-infrastructure-audit.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-credential-audit-${{ inputs.environment }}-${{ github.run_id }}
          path: .artifacts/admin-infrastructure/audit.json
          if-no-files-found: error
          retention-days: 14
