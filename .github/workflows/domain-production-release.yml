name: Domain Production Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact reviewed current-main SHA with successful CI and Admin CI
        type: string
        required: true
      hardened_sha:
        description: Exact approved hardening ancestor
        type: string
        required: true
      staging_run_id:
        description: Successful same-SHA Domain Staging Release run
        type: string
        required: true
      certification_run_id:
        description: Fresh same-SHA Production Read-Only Certification run
        type: string
        required: true
      staging_acceptance_json:
        description: Public operator attestation with evidence links for every real staging acceptance check
        type: string
        required: true
      confirm_staging_acceptance:
        description: Staging checks are evidenced; PayOS may be explicitly owner-waived with the separate confirmation
        type: boolean
        default: false
      confirm_payos_owner_waiver:
        description: Owner explicitly accepts existing production PayOS without repeating settlement; inspect the waiver evidence before approval
        type: boolean
        default: false
      confirm_production:
        description: Intentionally activate production and its three Takolio hostnames after independent Environment review
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: frigo-deploy-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'hello-tako/Takolio' && github.repository_id == '1422954151' && inputs.confirm_production == true && inputs.confirm_staging_acceptance == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Match trusted checkout to dispatched workflow and requested SHA before executing source
        env:
          RELEASE_SHA: ${{ inputs.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$WORKFLOW_SHA"
          test "$GITHUB_SHA" = "$RELEASE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Verify staging and certification, upload, activate, prove and observe production
        id: activate
        env:
          RELEASE_SHA: ${{ inputs.ref }}
          HARDENED_SHA: ${{ inputs.hardened_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
          STAGING_ACCEPTANCE_JSON: ${{ inputs.staging_acceptance_json }}
          CONFIRM_PAYOS_OWNER_WAIVER: ${{ inputs.confirm_payos_owner_waiver }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          CONFIRM_STAGING_ACCEPTANCE: ${{ inputs.confirm_staging_acceptance }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_VERIFY_TOKEN: ${{ secrets.RELEASE_VERIFY_TOKEN }}
        run: node scripts/domain/production-provider.mjs
      - name: Reconcile recorded production activation after failure or cancellation
        if: (failure() || cancelled()) && steps.activate.outcome != 'skipped'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_VERIFY_TOKEN: ${{ secrets.RELEASE_VERIFY_TOKEN }}
        run: node scripts/domain/production-provider.mjs recover
      - name: Retain sanitized production receipt including uncertain outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: domain-production-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/domain/production-release/receipt.json
          if-no-files-found: warn
          retention-days: 90
