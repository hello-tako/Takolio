name: Admin CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/admin-v1-r2-production-readiness]
permissions:
  contents: read
concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Public change scan
        run: python3 scripts/admin-public-scan.py
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:migrations
      - run: pnpm build
      - run: node scripts/admin-release-preflight.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Real local multi-Worker boundary
        run: node scripts/admin-workerd-check.mjs --out .artifacts/admin-r2/workerd.json
      - name: Admin migration compatibility matrix
        run: node scripts/admin-migration-matrix.mjs --out .artifacts/admin-r2/migration-matrix.json
      - name: Browser regression
        run: pnpm test:admin:e2e
      - name: Keyboard eventual-state regression (10 consecutive runs)
        run: pnpm exec playwright test -c playwright.admin.config.ts -g 'scrollable tables' --repeat-each 10
      - name: Verify generated screenshots do not alter tracked references
        run: git diff --exit-code -- docs/admin/screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: admin-evidence-${{ github.sha }}
          path: |
            .artifacts/admin-r2/release-plan.json
            .artifacts/admin-r2/workerd.json
            .artifacts/admin-r2/migration-matrix.json
          retention-days: 14
